<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${board?.id == null ? '게시글 등록' : '게시글 수정'}">게시판</title>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container board">
    <div class="board-header">
        <h1 th:text="${board?.id == null ? '게시글 등록' : '게시글 수정'}"></h1>
        <a href="/board/list" class="btn btn-default">목록</a>
    </div>
    <br>
    <input id="board_id" type="hidden" th:value="${board?.id}"/>

    <table class="post-list table">
        <tr>
            <th>제목</th>
            <td><input id="board_title" type="text" class="form-control" th:value="${board?.title}"/></td>
        </tr>
        <tr>
            <th>이름</th>
            <td><input id="board_writer" type="text" class="form-control" th:value="${board?.writer}"/></td>
        </tr>
        <tr th:if="${board?.id == null}">
            <th>비밀번호</th>
            <td><input id="board_password" type="password" class="form-control"/></td>
        </tr>
        <tr>
            <th>내용</th>
            <td><textarea id="board_content" class="form-control" rows="7" th:text="${board?.content}"></textarea></td>
        </tr>
    </table>

    <div class="pull-right">
        <button th:if="${board?.id == null}" type="button" class="btn btn-primary" id="btn_save">등록</button>
        <button th:if="${board?.id != null}" type="button" class="btn btn-info" id="btn_update">수정 완료</button>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 등록 버튼
        const btnSave = document.getElementById('btn_save');
        if (btnSave) {
            btnSave.addEventListener('click', async () => {
                const title = document.getElementById('board_title').value;
                const writer = document.getElementById('board_writer').value;
                const password = document.getElementById('board_password').value;
                const content = document.getElementById('board_content').value;

                if (!title || !writer || !password || !content) {
                    alert('모든 항목을 입력해 주세요.');
                    return;
                }

                const payload = { title, writer, password, content };

                try {
                    const res = await fetch('/board/api', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }, // 오타 및 쉼표(,) 수정완료
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        alert('등록 성공');
                        location.href = '/board/list';
                    } else {
                        alert('등록 실패');
                    }
                } catch (err) {
                    console.error(err);
                    alert('통신 중 오류가 발생했습니다.');
                }
            });
        }

        // 수정 버튼
        const btnUpdate = document.getElementById('btn_update');
        if (btnUpdate) {
            btnUpdate.addEventListener('click', async () => {
                const boardId = document.getElementById('board_id').value;
                const title = document.getElementById('board_title').value;
                const writer = document.getElementById('board_writer').value;
                const content = document.getElementById('board_content').value;

                if (!title || !writer || !content) {
                    alert('모든 항목을 입력해 주세요.');
                    return;
                }

                const payload = { title, writer, content };

                try {
                    const res = await fetch(`/board/api/${boardId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        alert('수정 성공');
                        location.href = `/board/${boardId}`;
                    } else {
                        alert('수정 실패');
                    }
                } catch (err) {
                    console.error(err);
                    alert('통신 중 오류가 발생했습니다.');
                }
            });
        }
    });
</script>
</body>
</html>

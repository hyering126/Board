<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>게시글 상세</title>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
</head>
<body>
<div class="container board">
    <div class="board-header">
        <h1>게시글 상세</h1>
        <a href="/board/list" class="btn btn-default">목록</a>
    </div>
    <br>
    <table class="post-list table">
        <tr>
            <th>등록일시</th>
            <td th:text="${board.createdDate != null ? #temporals.format(board.createdDate, 'yyyy-MM-dd HH:mm') : '-'}"></td>
            <th>이름</th>
            <td th:text="${board.writer}"></td>
        </tr>
        <tr>
            <th>제목</th>
            <td colspan="3" th:text="${board.title}"></td>
        </tr>
        <tr>
            <th>내용</th>
            <td colspan="3" style="height: 150px; white-space: pre-wrap;" th:text="${board.content}"></td>
        </tr>
    </table>

    <div class="pull-right">
        <button type="button" class="btn btn-info" onclick="handleAuth('edit')">수정</button>
        <button type="button" class="btn btn-danger" onclick="handleAuth('delete')">삭제</button>
    </div>
</div>

<script th:inline="javascript">
    let boardId=/*[[${board.id}]]*/ 0;

    async function handleAuth(type) {
        const password = prompt("비밀번호를 입력하세요:");
        if (!password) return;

        try {
            const res = await fetch(`/board/api/${boardId}/verify-password`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            });

            if (res.ok) {
                if (type === 'edit') {
                    location.href = `/board/edit/${boardId}`;
                } else if (type === 'delete') {
                    if (confirm("정말 삭제하시겠습니까?")) {
                        await deleteBoard();
                    }
                }
            } else {
                alert("비밀번호가 일치하지 않습니다.");
            }
        } catch (err) {
            alert("인증 오류가 발생했습니다.");
        }
    }

    async function deleteBoard() {
        const res = await fetch(`/board/api/${boardId}`, { method: 'DELETE'});
        if (res.ok) {
            alert("삭제되었습니다.");
            location.href = "/board/list";
        }
    }
</script>
</body>
</html>
